version: "3.9"

services:
  env-king:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: env-king
    ports:
      - "127.0.0.1:28888:8080"
    volumes:
      - ./workdir:/app/workdir
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: env-king-web
    ports:
      - "127.0.0.1:28889:3001"
    depends_on:
      - env-king
    restart: unless-stopped


