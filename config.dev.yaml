# Env King 开发环境配置

# GitHub 私有仓库拉取（用于流水线）
github:
  token: ""  # 填写 GITHUB_TOKEN 或 Personal Access Token

# Harbor 镜像仓库
harbor:
  host: ""      # 如 harbor.example.com
  project: library

# 流水线工作目录
pipeline:
  work_dir: /tmp/env-king-pipeline

# Clash 代理（仅 Linux）
clash:
  install_dir: /tmp/env-king-clash-install

# Agent 沙盒工作目录
agent:
  workspace_dir: ./.env-king-agent
